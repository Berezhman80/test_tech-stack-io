name: Nightly regression
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
jobs:
  regression:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      LOGIN: ${{ secrets.LOGIN }}
      PASSWORD: ${{ secrets.PASSWORD }}
      ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run @regression tests
        run: xvfb-run npx playwright test --grep "@regression" --reporter=html --reporter=json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-regression
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Count test results
        id: counts
        if: always()
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from 'node:fs';

          const { stats } = JSON.parse(readFileSync('results.json', 'utf8'));
          const total = stats.expected + stats.unexpected + stats.flaky + stats.skipped;

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `total=${total}\npassed=${stats.expected}\nfailed=${stats.unexpected}\n`,
          );
          EOF
      - name: Notify Slack
        if: ${{ success() || failure() }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: |
              Total: ${{ steps.counts.outputs.total }}
              Passed: ${{ steps.counts.outputs.passed }}
              Failed: ${{ steps.counts.outputs.failed }}
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
