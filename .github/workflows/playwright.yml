name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      LOGIN: ${{ secrets.LOGIN }}
      PASSWORD: ${{ secrets.PASSWORD }}
      ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run UI tests
        run: xvfb-run npx playwright test --project=chromium
      - name: Save UI report
        if: ${{ !cancelled() }}
        run: mkdir -p reports && mv playwright-report reports/ui
      - name: Run API tests
        if: ${{ !cancelled() }}
        run: xvfb-run npx playwright test --project=api
      - name: Save API report
        if: ${{ !cancelled() }}
        run: mkdir -p reports && mv playwright-report reports/api
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/
          retention-days: 30
